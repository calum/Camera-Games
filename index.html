<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Camera Games</title>
    <meta name="description" content="A movement game for kids: a camera on the TV tracks them and drops them into a cartoon world." />
    <meta name="theme-color" content="#0b1020" />
    <!-- installable as an app (full screen, works offline after the first visit) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      /* grown-up buttons (src/controls.js): hidden until someone touches the screen */
      #controls { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; border-radius: 18px;
        background: rgba(8, 12, 30, 0.82); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: calc(100vw - 32px); box-sizing: border-box; }
      #controls.shown { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
      #controls button { font: 800 clamp(16px, 2.4vh, 26px) "Trebuchet MS", system-ui, sans-serif; color: #fff; background: #2b3a67;
        border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; padding: 0.6em 1em; min-height: 48px; cursor: pointer; }
      #controls button[data-action="start"] { background: #2e8b57; }
      #controls button:focus-visible { outline: 3px solid #ffe14d; }
      /* "full screen works best" note (src/controls.js), top right, menu only */
      #fullscreen-nudge { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; align-items: center; gap: 10px;
        padding: 8px 10px 8px 14px; border-radius: 14px; background: rgba(8, 12, 30, 0.82); color: #fff; max-width: calc(100vw - 24px); box-sizing: border-box;
        font: 700 clamp(14px, 2vh, 20px) "Trebuchet MS", system-ui, sans-serif; }
      #fullscreen-nudge[hidden] { display: none; }
      #fullscreen-nudge button { font: inherit; font-weight: 800; color: #fff; background: #2e8b57; border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px; padding: 0.45em 0.8em; min-height: 44px; cursor: pointer; }
      #fullscreen-nudge button.close { background: transparent; border-color: transparent; padding: 0.45em 0.6em; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
